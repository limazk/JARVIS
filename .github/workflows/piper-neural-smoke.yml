name: Piper neural pt-BR integration smoke

on:
  pull_request:
    paths:
      - "JARVIS/voice/piper_engine.py"
      - "JARVIS/voice/text_to_speech.py"
      - "JARVIS/scripts/setup_piper_voice.py"
      - "JARVIS/tests/test_piper_*.py"
      - ".github/workflows/piper-neural-smoke.yml"
  workflow_dispatch:

jobs:
  piper-real-wav:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python settings dependency
        run: python -m pip install python-dotenv
      - name: Download official standalone Piper and pt-BR voice
        working-directory: JARVIS
        run: python scripts/setup_piper_voice.py
      - name: Synthesize real Brazilian Portuguese WAV with the native binary
        working-directory: JARVIS
        run: |
          python - <<'PY'
          from voice.piper_engine import piper_status, synthesize_piper
          import wave
          ok, reason = piper_status()
          print(reason)
          assert ok, reason
          output = synthesize_piper("Olá, sou o Jarvis. Estou falando português brasileiro.")
          assert output is not None and output.is_file()
          with wave.open(str(output), "rb") as audio:
              assert audio.getnframes() > 1000
              assert audio.getframerate() >= 16000
              print(f"Piper WAV: {audio.getnframes()} frames, {audio.getframerate()} Hz")
          output.unlink()
          PY
